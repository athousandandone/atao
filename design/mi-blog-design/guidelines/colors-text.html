<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body { margin: 0; padding: 24px 28px; }</style>
</head>
<body>
<div style="display:flex; flex-direction:column; gap:10px;">
<div style="font:500 26px var(--font-display); color:var(--text-heading);">Headings &amp; strong rules <span class="meta-label" style="font-size:9px;">--text-heading</span></div>
<div style="font:400 19px var(--font-body); color:var(--text-body);">Long-form body text, the reading colour <span class="meta-label" style="font-size:9px;">--text-body</span></div>
<div style="font:400 17px var(--font-body); color:var(--text-secondary);">Excerpts, standfirsts, footnotes <span class="meta-label" style="font-size:9px;">--text-secondary</span></div>
<div class="meta-label">Metadata, captions, nav — --text-meta</div>
<div class="meta-label" style="color:var(--text-ghost);">Placeholders, folios — --text-ghost</div>
</div>
</body>
</html>
