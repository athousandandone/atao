<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../styles.css">
<style>body { margin: 0; padding: 24px 28px; }</style>
</head>
<body>
<div class="prose" style="max-width:600px;">
<h3 style="margin-top:0;">Ingredients</h3>
<dl>
<dt>Strong white flour</dt><dd>450 g</dd>
<dt>Water, 26°C</dt><dd>350 g</dd>
<dt>Ripe starter</dt><dd>100 g</dd>
</dl>
<h3>Method</h3>
<ol>
<li>Dissolve the starter in the water; add both flours and mix. Rest 45 minutes.</li>
<li>Fold every 40 minutes for 3 hours, then leave until grown by half.</li>
</ol>
</div>
</body>
